name = "tai-auth-proxy"
main = "src/index.js"
compatibility_date = "2024-12-01"
# The renderer serializes a self-contained browser function. Avoid injecting
# external name-preservation helpers into that inline script.
keep_names = false

# The July 2026 login proxy remains retired. Status and documents come from
# BOS freight D1. Location history uses the separate bounded public API path.
# TAI_API_KEY is configured only as a Cloudflare secret. Retired login secrets
# are not used, changed, or deleted by this release.

# The workers.dev alias must not resolve — tracking links use the custom
# domain only (bound in dashboard: shipment.trackblkstocks.com).
workers_dev = false

# Justin approved activation on 2026-10-19. Cloudflare API retrieval was verified before enabling the map.
[vars]
TRACKING_LOCATIONS_ENABLED = "true"
TAI_REFRESH_ENABLED = "true"
TRACKING_LOCATIONS_UI_ENABLED = "true"

[[durable_objects.bindings]]
name = "TRACKING_LOCATIONS"
class_name = "TrackingLocations"

[[migrations]]
tag = "v1-tracking-locations"
new_sqlite_classes = ["TrackingLocations"]

# ─── D1: bos-app's freight database, bound READ-ONLY by convention ───
# Same cross-binding pattern files-blkstocks-worker uses (TEAM_DB). This
# worker only ever runs a single SELECT by tai_shipment_id — never write
# to this database from here; bos-app owns its schema and migrations.
[[d1_databases]]
binding = "FREIGHT_DB"
database_name = "freight-data"
database_id = "8729fde6-945c-4c91-a127-a080c68a7515"

# ─── Custom Domain ───
# Configured in Cloudflare Dashboard → Workers → tai-auth-proxy → Settings →
# Domains & Routes: shipment.trackblkstocks.com (docs historically said
# track.blkstocks.com; the worker is host-agnostic either way).
